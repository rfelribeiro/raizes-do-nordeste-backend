# Ambiente canônico de desenvolvimento. Toda configuração vem do .env (gerado por `make setup`).
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Publicado apenas em loopback; útil para inspeção com um cliente SQL local.
      - "127.0.0.1:${DB_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: dev
      args:
        UID: ${HOST_UID:-1000}
    env_file: .env
    environment:
      # Dentro da rede do compose o banco é alcançado pelo nome do serviço.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "127.0.0.1:${API_PORT}:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Pipeline analítico (DW). Fora do `make up`: só roda via `make dw*` (profile "analytics").
  analytics:
    profiles: ["analytics"]
    build:
      context: ./analytics
      args:
        UID: ${HOST_UID:-1000}
    env_file: .env
    environment:
      # Dentro da rede do compose o banco é alcançado pelo nome do serviço.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Caminhos absolutos dentro do contêiner (o ./data do host é montado em /app/data).
      DW_DUCKDB_PATH: /app/data/warehouse/raizes.duckdb
      DW_LAKE_PATH: /app/data/lake
    volumes:
      - ./data:/app/data
      - ./analytics:/app/analytics
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
