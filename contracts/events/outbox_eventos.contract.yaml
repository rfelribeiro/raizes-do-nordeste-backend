# Contrato de dados no estilo do Open Data Contract Standard (ODCS), simplificado.
# Referência: https://bitol-io.github.io/open-data-contract-standard/
apiVersion: v3.0.0
kind: DataContract
id: raizes.outbox_eventos
name: Eventos de domínio da outbox
version: 1.0.0
status: active
description:
  purpose: >
    Eventos de domínio (fatos de negócio já ocorridos) gravados na mesma transação do caso de uso e
    consumidos pelo Data Warehouse (bronze, silver e gold).
  limitations: >
    Entrega ao menos uma vez; o consumidor deduplica por id_evento. Eventos podem chegar fora de
    ordem de ocorrido_em (a ordem de captura é id_sequencial).
owner: Plataforma de dados (autor do projeto)
producer:
  name: API raizes
  system: src/raizes (SqlAlchemyOutboxWriter, tabela PostgreSQL outbox_eventos)
consumers:
  - name: DW (extrator incremental + dbt)
    system: analytics/ingestao/extrair_outbox.py e analytics/dbt/raizes_dw
schema:
  format: json-schema
  ref: outbox_evento_envelope.schema.json
  physical_table: outbox_eventos
  silver_model: stg_outbox_eventos
  fields:
    - {name: id_evento, type: uuid, required: true, unique: true}
    - {name: tipo_evento, type: string, required: true}
    - {name: versao_schema, type: integer, required: true}
    - {name: tipo_agregado, type: string, required: true}
    - {name: id_agregado, type: string, required: true}
    - {name: payload, type: object, required: true}
    - {name: ocorrido_em, type: timestamp, required: true, timezone: UTC}
    - {name: registrado_em, type: timestamp, required: true, timezone: UTC}
    - {name: id_sequencial, type: integer, required: true}
semantics:
  formato_tipo_evento: snake_case, padrão <entidade>_<particípio> em português (ex. pedido_criado)
  ocorrido_em: instante do fato de negócio (UTC)
  registrado_em: instante em que o banco registrou o evento (UTC), atribuído pelo banco
  id_sequencial: ordem de captura; marca d'água da extração incremental
sla:
  freshness:
    description: >
      Atraso máximo entre registrado_em e a disponibilidade no bronze. A extração é incremental e
      ignora eventos registrados há menos de DW_EXTRACTION_LAG_SECONDS.
    max_delay: DW_EXTRACTION_LAG_SECONDS + intervalo de extração
    defaults:
      DW_EXTRACTION_LAG_SECONDS: 5
      extraction_interval: definido pelo agendamento da extração (hoje, execução sob demanda via make dw-ingest)
quality:
  - rule: id_evento único
    check: "unique(id_evento)"
    enforced_by: chave primária no PostgreSQL; teste unique no dbt (stg_outbox_eventos)
  - rule: ocorrido_em <= registrado_em
    check: "ocorrido_em <= registrado_em"
    enforced_by: contrato; a verificar com teste de dados no dbt quando houver eventos reais
    note: >
      registrado_em usa now() do PostgreSQL (início da transação); um evento criado depois do início
      da transação pode ter ocorrido_em ligeiramente maior. Validar com eventos reais.
  - rule: versao_schema >= 1
    check: "versao_schema >= 1"
    enforced_by: DomainEvent (domínio) e JSON Schema
  - rule: envelope válido
    check: validação contra outbox_evento_envelope.schema.json
    enforced_by: tests/unit/test_event_contract.py
privacy:
  contains_pii: false
  rule: >
    O payload não carrega dados pessoais em claro (nome, CPF, e-mail, telefone, endereço, data de
    nascimento). Usar identificadores internos e atributos derivados.
  legal_basis: LGPD; eventos são permanentes no bronze (imutável), por isso a regra é inegociável
versioning:
  policy: >
    Mudança aditiva: mesmo tipo_evento, incrementa versao_schema. Mudança incompatível: novo
    tipo_evento ou novo major. Nunca remover nem renomear campo sem novo major.
  details: ../README.md
