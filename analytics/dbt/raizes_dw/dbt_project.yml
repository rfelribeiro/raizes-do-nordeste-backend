name: raizes_dw
version: "0.1.0"
config-version: 2
profile: raizes_dw

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false
  use_colors: false

vars:
  # Definição de negócio a validar pelo autor: período em que os produtos juninos são vendidos.
  # Formato MM-DD (inclusivo nas duas pontas). Padrão proposto: 01/06 a 31/07.
  festa_junina_season_start: "06-01"
  festa_junina_season_end: "07-31"
  # Intervalo da dimensão de data (dim_date).
  dim_date_start_date: "2024-01-01"
  dim_date_end_date: "2030-12-31"

models:
  raizes_dw:
    staging:
      +materialized: table
      +schema: silver
    marts:
      +materialized: table
      +schema: gold

seeds:
  raizes_dw:
    +schema: silver
    national_holidays:
      +column_types:
        holiday_date: date
        holiday_name: varchar
        holiday_type: varchar
