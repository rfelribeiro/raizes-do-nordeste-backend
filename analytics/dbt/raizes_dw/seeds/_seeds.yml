version: 2

seeds:
  - name: feriados_nacionais
    description: >
      Feriados nacionais do Brasil (2024-2030), gerados por
      analytics/ingestao/gerar_feriados.py. Nomes dos feriados em português.
    columns:
      - name: data_feriado
        description: Data do feriado.
        data_tests:
          - not_null
      - name: nome_feriado
        description: Nome do feriado em português (ex. Natal).
        data_tests:
          - not_null
      - name: tipo_feriado
        description: Tipo do feriado; por ora sempre "nacional".
        data_tests:
          - not_null
